services:
    lewdity:
        ports:
            - 8080:80
        image: ghcr.io/korewachino/lewdity-docker
        # `docker compose up` pulls the published image. Use
        # `docker compose up --build` to build it locally instead, optionally
        # pinning a game release with GAME_VERSION=0.5.12.13.
        build:
            context: .
            dockerfile: Containerfile
            args:
                GAME_VERSION: ${GAME_VERSION:-master}
        # Save data lives here. Without this, saves are lost whenever the
        # container is recreated.
        volumes:
            - lewdity-saves:/data

volumes:
    lewdity-saves: